server.port=8084
spring.application.name=NotificationService

#Eureka configuration 
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8762/eureka/
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.instanceId=host.docker.internal:${spring.application.name}:${server.port}

# Kafka Consumer Configuration
spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}

#Important : use a completely different group ID so kafka broadcasts to BOTH services!
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


