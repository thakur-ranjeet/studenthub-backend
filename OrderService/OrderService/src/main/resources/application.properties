server.port=8085
spring.application.name=ORDER-SERVICE

# The orderdb database is created automatically on first start
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/orderdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8762/eureka/
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.instanceId=localhost:${spring.application.name}:${server.port}

# Same secret as the API gateway (JWT_SECRET environment variable). No default on purpose.
jwt.secret=${JWT_SECRET}

# Where to read course names and prices from
course.service.url=${COURSE_SERVICE_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info

# Razorpay Test Mode keys (Windows environment variables, never written in code)
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.base-url=https://api.razorpay.com
# Secret you choose when you create the webhook in the Razorpay dashboard (different from the API key secret).
# Optional: without it the webhook endpoint answers 503 and everything else keeps working.
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
