server.port=8086
spring.application.name=CHATBOT-SERVICE

eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8762/eureka/
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.instanceId=localhost:${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info

# Same secret as the API gateway (JWT_SECRET environment variable). No default on purpose.
jwt.secret=${JWT_SECRET}

# Where the assistant reads its data from (it calls the services directly, not through the gateway)
course.service.url=${COURSE_SERVICE_URL:http://localhost:8082}
order.service.url=${ORDER_SERVICE_URL:http://localhost:8085}
student.service.url=${STUDENT_SERVICE_URL:http://localhost:8081}

# AI mode. Leave ANTHROPIC_API_KEY unset and the assistant still works in "basic" mode (keyword based, no AI).
chatbot.anthropic.api-key=${ANTHROPIC_API_KEY:}
chatbot.anthropic.model=${CHATBOT_MODEL:claude-haiku-5-5}
chatbot.anthropic.max-tokens=700
chatbot.anthropic.max-tool-rounds=4

# Abuse limits
chatbot.max-message-chars=500
chatbot.rate-limit-per-minute=20

# ---- AI features (course drafts, recommendations, search, quizzes, explanations) ----
# Choose the AI provider with AI_PROVIDER:
#   anthropic  needs ANTHROPIC_API_KEY (paid)
#   gemini     needs GEMINI_API_KEY (Google AI Studio, has a free tier with limits)
#   ollama     free, runs on your own PC (install Ollama and run: ollama pull llama3.1)
# Leave AI_PROVIDER unset to auto-pick: Gemini if only GEMINI_API_KEY is set, otherwise Anthropic.
ai.provider=${AI_PROVIDER:gemini}

ai.anthropic.model-quality=${AI_MODEL_QUALITY:claude-sonnet-5-5}
ai.anthropic.model-fast=${AI_MODEL_FAST:claude-haiku-5-5}

ai.gemini.api-key=${GEMINI_API_KEY:}
# If this model is unknown or retired, the service automatically tries gemini-3.8-flash, 3.6-flash, 3.5-flash.
ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

ai.ollama.url=${OLLAMA_URL:http://localhost:11434}
ai.ollama.model=${OLLAMA_MODEL:llama3.1}

# a local model on a slow PC can take a while to write a whole course page
ai.read-timeout-seconds=120
ai.rate-limit-per-minute=10
