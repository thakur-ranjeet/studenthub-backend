spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/Studentdb
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update

server.port=8081
spring.application.name=STUDENT-SERVICE
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8762/eureka/
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.instanceId=host.docker.internal:${spring.application.name}:${server.port}

#Actuator for monitoring microservices
 
management.endpoint.health.show-details=always
info.app.name=student service
info.app.description=This is the demo application of department microservice
info.app.version=1.0.0

management.endpoints.web.exposure.include=*

info.application.name = Actuator info
info.application.description= A demo Spring microservice project with information
info.organization = Bsl

management.info.env.enabled=true
management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

#kafka Implementation
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer