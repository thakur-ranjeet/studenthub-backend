spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/coursedb
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8082
spring.application.name=COURSE-SERVICE
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8762/eureka/
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.instanceId=host.docker.internal:${spring.application.name}:${server.port}

#Actuator for monitoring microservices
 
management.endpoint.health.show-details=always
info.app.name=course service
info.app.description=This is the demo application of department microservice
info.app.version=1.0.0

management.endpoints.web.exposure.include=*

info.application.name = Actuator info
info.application.description= A demo Spring microservice project with information
info.organization = Bsl

management.info.env.enabled=true
management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

#Kafka Implementation
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=course-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

#Redis Connection Settings
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.time-to-live=600000

